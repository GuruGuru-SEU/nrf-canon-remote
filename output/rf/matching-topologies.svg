<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><rect width="960" height="470" rx="18" fill="#f3f5ef"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#263e35"><text x="38" y="42" font-size="22" font-weight="600">π network / branch order: P1 → Zs → P2</text><text x="38" y="78" font-size="17">P1 and P2: shunt to GND · Zs: series · each may be C or L</text><text x="38" y="143" font-size="18">50 Ω input</text><text x="752" y="143" font-size="18">Antenna load</text><text x="736" y="177" font-size="15">L220 output reference</text><g stroke="#315e4c" stroke-width="3" fill="none"><path d="M60 170H420 M540 170H710"/><rect x="420" y="150" width="120" height="40" rx="4"/><path d="M250 170V210 M250 270V304 M650 170V210 M650 270V304"/><rect x="230" y="210" width="40" height="60" rx="4"/><rect x="630" y="210" width="40" height="60" rx="4"/><path d="M232 304H268 M238 312H262 M245 320H255 M632 304H668 M638 312H662 M645 320H655"/></g><circle cx="250" cy="170" r="5"/><circle cx="650" cy="170" r="5"/><text x="469" y="140" font-size="18">Zs</text><text x="283" y="248" font-size="18">P1</text><text x="683" y="248" font-size="18">P2</text><text x="38" y="374" font-size="18">L-input: populate P1 + Zs; leave P2 open.</text><text x="38" y="405" font-size="18">L-load: populate Zs + P2; leave P1 open.</text><text x="38" y="438" font-size="18">Common low-pass π: P1 = C, Zs = L, P2 = C.</text></g></svg>