8 L 1176.48,-504.648" style="stroke:#203543;fill:none;stroke-width:1.35;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 1176.48,-504.648 L 1176.48,-461.304 L 1176.48,-417.96" style="stroke:#267365;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 1176.48,-417.96000000000004 L 1167.192,-417.96 L 1157.904,-417.96" style="stroke:#267365;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="40.248000000000005" y="-904.196" dominant-baseline="central" fill="#267365" font-size="11" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="40.248000000000005" dy="11">06 / 07</tspan></text><text x="154.8" y="-912.648" dominant-baseline="central" fill="#203543" font-size="21" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="154.8" dy="21">RGB 指示灯 · GPIO 直驱</tspan></text><text x="1442.736" y="-905.744" dominant-baseline="central" fill="#203543" font-size="11" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="1442.736" dy="11">nRF CANON REMOTE</tspan></text><text x="1442.736" y="-878.9760000000001" dominant-baseline="central" fill="#687b83" font-size="9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="1442.736" dy="9">SCHEMATIC v0.1  /  2026-09-20</tspan></text><text x="154.8" y="-872.2360000000001" dominant-baseline="central" fill="#687b83" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="154.8" dy="10">NH-B1515RGBA-GF · 共阳 VDD · 三路独立限流 · GPIO 低电平点亮</tspan></text><text x="61.92" y="-184.376" dominant-baseline="central" fill="#267365" font-size="11" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="61.92" dy="11">连接与 LAYOUT</tspan></text><text x="61.92" y="-153.96400000000003" dominant-baseline="central" fill="#203543" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="61.92" dy="10">D400：2=共阳，1=红阴极，4=绿阴极，3=蓝阴极；三个 LED 在同一封装内，不能共用限流电阻。</tspan></text><text x="61.92" y="-129.8152" dominant-baseline="central" fill="#203543" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="61.92" dy="10">共阳和 C400 接 VDD，不能接 VSYS；C400 与限流电阻靠近 LED，PWM 回流避开晶体与射频局部地。</tspan></text><text x="61.92" y="-105.66640000000001" dominant-baseline="central" fill="#203543" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="61.92" dy="10">GPIO：H0S1、无上下拉；先预置输出 1 再启用输出。PWM 低有效，停止 PWM / 休眠前恢复输出 1。</tspan></text><text x="61.92" y="-81.51760000000002" dominant-baseline="central" fill="#203543" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="61.92" dy="10">3.3V 下粗估 R/G/B ≈ 1.1/0.6/0.5mA，非保证值；低电量绿蓝会变暗，配合导光件实测亮度。</tspan></text><text x="40.248000000000005" y="-35.316" dominant-baseline="central" fill="#687b83" font-size="9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="40.248000000000005" dy="9">同名网络跨页相连  ·  实心点为连接  ·  × 为 NC  ·  DNP 为不装  ·  JLC C… 为立创物料编号</tspan></text><text x="1445.832" y="-35.316" dominant-baseline="central" fill="#687b83" font-size="9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="1445.832" dy="9">设计审阅稿  /  06</tspan></text><text x="758.52" y="-816.96" dominant-baseline="central" fill="#203543" font-size="12" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle"><tspan x="758.52" dy="12">D400 · NH-B1515RGBA-GF · 单一 RGB 封装</tspan></text><text x="758.52" y="-787.144" dominant-baseline="central" fill="#4c718a" font-size="8.5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle"><tspan x="758.52" dy="8.5">JLC C52212029</tspan></text><text x="136.22400000000002" y="-765.424" dominant-baseline="central" fill="#267365" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="136.22400000000002" dy="10">VDD</tspan></text><text x="253.87199999999999" y="-767.52" dominant-baseline="central" fill="#687b83" font-size="9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="253.87199999999999" dy="9">2 / A</tspan></text><text x="1331.28" y="-716.888" dominant-baseline="central" fill="#203543" font-size="11" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="1331.28" dy="11">C400</tspan></text><text x="1331.28" y="-694.764" dominant-baseline="central" fill="#203543" font-size="9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="1331.28" dy="9">100nF / 16V</tspan></text><text x="1331.28" y="-675.9976" dominant-baseline="central" fill="#4c718a" font-size="8.5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="1331.28" dy="8.5">JLC C60474</tspan></text><text x="351.396" y="-712.696" dominant-baseline="central" fill="#ae5050" font-size="13" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="351.396" dy="13">R</tspan></text><text x="325.08" y="-648.324" dominant-baseline="central" fill="#687b83" font-size="9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="325.08" dy="9">1 / K</tspan></text><text x="325.08" y="-571.3760000000001" dominant-baseline="central" fill="#203543" font-size="11" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="325.08" dy="11">R400</tspan></text><text x="325.08" y="-549.252" dominant-baseline="central" fill="#203543" font-size="9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="325.08" dy="9">1.2k</tspan></text><text x="325.08" y="-530.4856" dominant-baseline="central" fill="#4c718a" font-size="8.5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="325.08" dy="8.5">JLC C2909307</tspan></text><text x="291.024" y="-440.34400000000005" dominant-baseline="central" fill="#267365" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="291.024" dy="10">LED_R_PWM</tspan></text><text x="309.6" y="-390.80800000000005" dominant-baseline="central" fill="#687b83" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle"><tspan x="309.6" dy="10">U200.16 / P0.13</tspan></text><text x="784.836" y="-712.696" dominant-baseline="central" fill="#397e61" font-size="13" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="784.836" dy="13">G</tspan></text><text x="758.52" y="-648.324" dominant-baseline="central" fill="#687b83" font-size="9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="758.52" dy="9">4 / K</tspan></text><text x="758.52" y="-571.3760000000001" dominant-baseline="central" fill="#203543" font-size="11" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="758.52" dy="11">R401</tspan></text><text x="758.52" y="-549.252" dominant-baseline="central" fill="#203543" font-size="9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="758.52" dy="9">1k</tspan></text><text x="758.52" y="-530.4856" dominant-baseline="central" fill="#4c718a" font-size="8.5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start"><tspan x="758.52" dy="8.5">JLC C106235</tspan></text><text x="724.4639999999999" y="-440.34400000000005" dominant-baseline="central" fill="#267365" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end"><tspan x="724