YaHei, sans-serif" text-anchor="middle"><tspan x="758.52" dy="12">GPIO = 0 → 点亮    ·    GPIO = 1 → 熄灭</tspan></text><text x="758.52" y="-283.996" dominant-baseline="central" fill="#687b83" font-size="10" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle"><tspan x="758.52" dy="10">H0S1：高灌电流 / 标准拉电流  ·  PWM 先用几百 Hz～1 kHz</tspan></text><circle cx="263.16" cy="-743.04" r="2.012" style="stroke:#267365;fill:#267365;stroke-width:1.35;stroke-dasharray:-;" /></svg>